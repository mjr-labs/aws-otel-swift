# Break-glass mirror to Bitbucket (EST-38) — INLINED copy of
# mjr-labs/.github mirror-to-bitbucket.yml: this repo is PUBLIC (fork of the
# public upstream), and public repos cannot call reusable workflows in a
# private repo.
#
# EST-123: everything from `permissions:` down is the SHARED REGION and must
# match the canonical copy byte for byte, comments included — the only exempt
# step is `Resolve mirror slug`, which the canonical parameterises and this copy
# cannot. `mjr-labs/.github` enforces that with `mirror-drift-check.yml`; it
# FAILS on any difference. The previous version of this comment asked a human to
# "keep in sync with the canonical copy on any change" and was disregarded
# twice: EST-89 found the identity literal still here, and EST-123 found this
# file still alerting to `secrets.SLACK_ALERTS_WEBHOOK` — which does not exist
# on this org, so it expanded to the empty string and paged nobody, months after
# EST-76 moved the canonical alert to Pushover.

name: Mirror

on:
  # EST-48: gated to `main`, NOT every branch. A bare `push:` fired the mirror
  # 433 times estate-wide in the first 11 days of August; each run bills a full
  # Actions minute for ~25 seconds of work, ~14% of the org's included
  # allowance. Coverage is unchanged — mirror-to-bitbucket.yml bare-clones and
  # pushes `--all` + `--tags` every run, so ANY trigger mirrors the FULL
  # current state. Branches and tags still reach Bitbucket, at the next `main`
  # push rather than instantly; dispatch below to mirror everything on demand.
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

env:
  BB_WORKSPACE: mjr-labs-mirror
  BB_PROJECT: MIR
  ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}

jobs:
  mirror:
    runs-on: ubuntu-latest
    # Serialise per repo: a rapid second push queues rather than racing the
    # first (each run pushes the full current state anyway).
    concurrency:
      group: mirror-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # EST-89: the email is the USERNAME half of the Bitbucket credential
      # (`-u email:token`) and now comes from the org secret, so both halves
      # live in one place and rotate together. An unset secret expands to an
      # empty string, and `-u :token` 401s on every REST call while `git push`
      # — which authenticates with the literal `x-bitbucket-api-token-auth` —
      # keeps working. That half-working mirror is the failure this workflow
      # exists to prevent, so fail before it can happen.
      - name: Assert the mirror identity is set
        run: |
          set -eu
          [ -n "${ATLASSIAN_EMAIL:-}" ] || {
            echo "::error::ATLASSIAN_EMAIL is empty — set the mjr-labs org secret (visibility: all)."
            exit 1
          }

      - name: Resolve mirror slug
        run: |
          SLUG="${GITHUB_REPOSITORY#*/}"
          echo "BB_SLUG=$SLUG" >> "$GITHUB_ENV"

      - name: Ensure the Bitbucket repo exists (private)
        env:
          BITBUCKET_MIRROR_TOKEN: ${{ secrets.BITBUCKET_MIRROR_TOKEN }}
        run: |
          set -eu
          API="https://api.bitbucket.org/2.0/repositories/${BB_WORKSPACE}/${BB_SLUG}"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -u "${ATLASSIAN_EMAIL}:${BITBUCKET_MIRROR_TOKEN}" "$API")
          if [ "$STATUS" = "404" ]; then
            # Repo creation targets the MIR project explicitly (the token lacks
            # project read scope, so discovery 403s; MIR is the owner's private
            # project and the whole mirror estate lives in it).
            echo "Creating ${BB_WORKSPACE}/${BB_SLUG} in project ${BB_PROJECT}"
            CREATE=$(curl -s -o /tmp/create.json -w '%{http_code}' -X POST \
              -u "${ATLASSIAN_EMAIL}:${BITBUCKET_MIRROR_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"scm\": \"git\", \"is_private\": true, \"project\": {\"key\": \"${BB_PROJECT}\"}}" "$API")
            case "$CREATE" in
              200|201) ;;
              *) echo "Repo creation failed (HTTP $CREATE):"; cat /tmp/create.json; exit 1 ;;
            esac
            # is_private is asserted, not assumed: a public mirror of private
            # code would be a leak, so fail loudly if Bitbucket ignored it.
            grep -q '"is_private": *true' /tmp/create.json || {
              echo "Created repo is NOT private — deleting nothing, failing loudly"; exit 1; }
          elif [ "$STATUS" != "200" ]; then
            echo "Unexpected HTTP $STATUS checking for ${BB_SLUG}"; exit 1
          fi

      - name: Bare-clone source
        run: |
          git clone --bare --quiet \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" repo.git

      - name: Push all branches and tags (non-force, force dependabot refs)
        env:
          BITBUCKET_MIRROR_TOKEN: ${{ secrets.BITBUCKET_MIRROR_TOKEN }}
        run: |
          set -eu
          cd repo.git
          DEST="https://x-bitbucket-api-token-auth:${BITBUCKET_MIRROR_TOKEN}@bitbucket.org/${BB_WORKSPACE}/${BB_SLUG}.git"
          git push --quiet --force "$DEST" 'refs/heads/dependabot/*'
          git push --quiet "$DEST" --all
          git push --quiet "$DEST" --tags

      # EST-76: Pushover, not Slack — the workspace is being cancelled and
      # this step was the ONLY surface a mirror failure ever had. It never
      # opened a JSM alert, so on cancellation it would have gone silent
      # for every repo at once, which is the failure this whole piece of
      # work exists to prevent.
      #
      # ⚠️ This stays a raw curl rather than going through the estate's
      # canonical sender (finance_core.alerts). Not an oversight: this
      # workflow checks out a BARE MIRROR (`repo.git`) and has no vendored
      # copy to import, and the caller's checkout is not available to a
      # reusable workflow. Swapping the destination keeps the number of
      # hand-rolled senders where it was; importing would mean checking out
      # a second repo on every mirror run of every repo in the org.
      #
      # priority 1 = the `failure` tier in that sender's map. Kept in step
      # with it by hand, which is the cost of the paragraph above.
      - name: Alert on failure
        if: failure()
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          curl -s --form-string "token=${PUSHOVER_TOKEN}" \
            --form-string "user=${PUSHOVER_USER_KEY}" \
            --form-string "title=${REPO} / mirror" \
            --form-string "message=💾 Bitbucket mirror push failed
          View run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --form-string "priority=1" \
            https://api.pushover.net/1/messages.json
